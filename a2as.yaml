agents:
  agent:
    type: instance
    models: [settings.documentation_model]
    mcp: [server]
    params:
      function: create_setup_agent
      name: Circuitron-Setup
      output_type: SetupOutput
      model_settings: model_settings
      instructions: [SETUP_AGENT_PROMPT]
  agent.create_code_correction_agent:
    type: factory
    models: [settings.code_correction_model]
    tools: [tools]
    mcp: [mcp_manager.get_server]
    params:
      function: create_code_correction_agent
      name: Circuitron-Corrector
      output_type: CodeCorrectionOutput
      model_settings: model_settings
      instructions: [CODE_CORRECTION_PROMPT]
  agent.create_code_generation_agent:
    type: factory
    models: [settings.code_generation_model]
    mcp: [mcp_manager.get_server]
    params:
      function: create_code_generation_agent
      name: Circuitron-Coder
      output_type: CodeGenerationOutput
      model_settings: model_settings
      instructions: [prompt]
  agent.create_code_validation_agent:
    type: factory
    models: [settings.code_validation_model]
    tools: [tools]
    mcp: [mcp_manager.get_server]
    params:
      function: create_code_validation_agent
      name: Circuitron-Validator
      output_type: CodeValidationOutput
      model_settings: model_settings
      instructions: [CODE_VALIDATION_PROMPT]
  agent.create_documentation_agent:
    type: factory
    models: [settings.documentation_model]
    mcp: [mcp_manager.get_server]
    params:
      function: create_documentation_agent
      name: Circuitron-DocSeeker
      output_type: DocumentationOutput
      model_settings: model_settings
      instructions: [DOC_AGENT_PROMPT]
  agent.create_erc_handling_agent:
    type: factory
    models: [settings.erc_handling_model]
    tools: [tools]
    mcp: [mcp_manager.get_server]
    params:
      function: create_erc_handling_agent
      name: Circuitron-ERCHandler
      output_type: ERCHandlingOutput
      model_settings: model_settings
      instructions: [ERC_HANDLING_PROMPT]
  agent.create_partfinder_agent:
    type: factory
    models: [settings.part_finder_model]
    tools: [tools]
    params:
      function: create_partfinder_agent
      name: Circuitron-PartFinder
      output_type: PartFinderOutput
      model_settings: model_settings
      instructions: [prompt]
  agent.create_partselection_agent:
    type: factory
    models: [settings.part_selection_model]
    tools: [tools]
    params:
      function: create_partselection_agent
      name: Circuitron-PartSelector
      output_type: PartSelectionOutput
      model_settings: model_settings
      instructions: [prompt]
  agent.create_plan_edit_agent:
    type: factory
    models: [settings.plan_edit_model]
    tools: [tools]
    params:
      function: create_plan_edit_agent
      name: Circuitron-PlanEditor
      output_type: PlanEditorOutput
      model_settings: model_settings
      instructions: [PLAN_EDIT_PROMPT]
  agent.create_planning_agent:
    type: factory
    models: [settings.planning_model]
    tools: [tools]
    params:
      function: create_planning_agent
      name: Circuitron-Planner
      output_type: PlanOutput
      input_guardrails: [pcb_query_guardrail]
      model_settings: model_settings
      instructions: [PLAN_PROMPT]
  agent.create_runtime_error_correction_agent:
    type: factory
    models: [settings.runtime_correction_model]
    tools: [tools]
    mcp: [mcp_manager.get_server]
    params:
      function: create_runtime_error_correction_agent
      name: Circuitron-RuntimeCorrector
      output_type: RuntimeErrorCorrectionOutput
      model_settings: model_settings
      instructions: [RUNTIME_ERROR_CORRECTION_PROMPT]
  pcb_query_agent:
    type: instance
    models: [gpt-5-nano]
    params:
      name: PCB Query Check
      output_type: PCBQueryOutput
      instructions: [Determine if the user's request is related to electrical or PCB design.]

models:
  gpt-5-nano:
    type: literal
    agents: [pcb_query_agent]
  settings.code_correction_model:
    type: variable
    agents: [agent.create_code_correction_agent]
  settings.code_generation_model:
    type: variable
    agents: [agent.create_code_generation_agent]
  settings.code_validation_model:
    type: variable
    agents: [agent.create_code_validation_agent]
  settings.documentation_model:
    type: variable
    agents: [agent, agent.create_documentation_agent]
  settings.erc_handling_model:
    type: variable
    agents: [agent.create_erc_handling_agent]
  settings.part_finder_model:
    type: variable
    agents: [agent.create_partfinder_agent]
  settings.part_selection_model:
    type: variable
    agents: [agent.create_partselection_agent]
  settings.plan_edit_model:
    type: variable
    agents: [agent.create_plan_edit_agent]
  settings.planning_model:
    type: variable
    agents: [agent.create_planning_agent]
  settings.runtime_correction_model:
    type: variable
    agents: [agent.create_runtime_error_correction_agent]

tools:
  execute_calculation:
    type: decorator
    params:
      description: |-
        Execute pure-Python maths code *generated by the LLM* in an isolated Docker container.

        Args:
            calculation_id: Correlates this request to its tool response.
            code: Python source (generated by the LLM) that prints the final value.
        Returns:
            CalcResult with stdout, stderr, and success flag.
  execute_final_script_tool:
    type: wrapper
    params:
      wraps: execute_final_script
  extract_pin_details:
    type: decorator
    params:
      description: Return pin details by creating Part object and accessing pins directly.
  get_kg_usage_guide:
    type: decorator
    params:
      description: "Return knowledge graph query examples for common validation tasks.\n\n    Args:\n        task_type: Category\
        \ of examples to return. Supported values are\n            ``\"class\"``, ``\"method\"``, ``\"function\"``, ``\"import\"\
        ``,\n            ``\"attribute\"``, ``\"workflow\"``, ``\"schema\"``, ``\"advanced\"``, and ``\"examples\"``.\n\n\
        \    Returns:\n        Guidance string containing ``query_knowledge_graph`` commands and usage patterns.\n\n    Example:\n\
        \        >>> get_kg_usage_guide(\"method\")\n        'method <name> <Class>\nmethod <name>'\n    "
  run_erc_tool:
    type: wrapper
    params:
      wraps: run_erc
  run_runtime_check_tool:
    type: wrapper
    params:
      wraps: run_runtime_check
  search_kicad_footprints:
    type: decorator
    params:
      description: |-
        Search KiCad footprint libraries using ``skidl.search_footprints``.

        Args:
            query: Search string passed to ``skidl.search_footprints``.
            max_results: Maximum number of results to return (default: 30).

        Returns:
            JSON string representing a list of matching footprints.
  search_kicad_libraries:
    type: decorator
    params:
      description: |-
        Search KiCad libraries using ``skidl.search``.

        Args:
            query: Search string passed to ``skidl.search``.
            max_results: Maximum number of results to return (default: 50).

        Returns:
            JSON string representing a list of matching parts, ordered by relevance.
  tools:
    type: variable
    agents: [agent.create_planning_agent, agent.create_plan_edit_agent, agent.create_partfinder_agent, agent.create_partselection_agent,
      agent.create_code_validation_agent, agent.create_code_correction_agent, agent.create_runtime_error_correction_agent,
      agent.create_erc_handling_agent]
    params:
      dynamic: "True"

mcp:
  mcp_manager.get_server:
    type: process
    agents: [agent.create_documentation_agent, agent.create_code_generation_agent, agent.create_code_validation_agent, agent.create_code_correction_agent,
      agent.create_runtime_error_correction_agent, agent.create_erc_handling_agent]
    params:
      dynamic: "True"
  server:
    type: process
    agents: [agent]
    params:
      dynamic: "True"

