    type: env
    params:
      caller: [os.getenv]
      path: [circuitron.cost_estimator]
  CIRCUITRON_MAX_TURNS:
    type: env
    params:
      caller: [os.getenv]
      path: [circuitron.settings]
  CIRCUITRON_NETWORK_TIMEOUT:
    type: env
    params:
      caller: [os.getenv]
      path: [circuitron.settings]
  CIRCUITRON_PRICES_FILE:
    type: env
    params:
      caller: [os.getenv]
      path: [circuitron.cost_estimator]
  CIRCUITRON_SKIP_MCP_CHECK:
    type: env
    params:
      caller: [os.getenv]
      path: [circuitron.network]
  KICAD_IMAGE:
    type: env
    params:
      caller: [os.getenv]
      path: [circuitron.settings]
  MCP_HEALTHCHECK:
    type: env
    params:
      caller: [os.getenv]
      path: [circuitron.config]
  MCP_URL:
    type: env
    params:
      caller: [os.getenv]
      path: [circuitron.config, circuitron.settings]
  var:
    type: env
    params:
      caller: [os.getenv]
      path: [circuitron.config]

files:
  .circuitron_history:
    type: literal
    actions: [read]
    params:
      caller: [__init__]
      path: [Path.home]
  .py:
    type: literal
    actions: [write]
    params:
      caller: [tempfile.NamedTemporaryFile, tempfile.mkstemp]
      mode: w
      delete: "False"
  circuitron_skidl_script.py:
    type: literal
    actions: [read]
    params:
      caller: [os.path.join]
      path: [output_dir]
  final_output_dir:
    type: variable
    actions: [read]
    params:
      caller: [os.path.abspath]
  output_dir:
    type: variable
    actions: [read]
    params:
      caller: [os.makedirs, os.listdir]
  path:
    type: variable
    actions: [read]
    params:
      caller: [os.path.isfile, open, json.load, os.makedirs, os.path.abspath]
  script_path:
    type: variable
    actions: [write]
    params:
      caller: [open]
      alias: [f]
  tmp:
    type: variable
    actions: [read]
    params:
      caller: [os.path.exists, os.makedirs]
  tmp_file_path:
    type: variable
    actions: [read]
    params:
      caller: [os.remove]

processes:
  docker:
    type: shell
    actions: [exec]
    args: [[ps, --format], [rm, -f], [rm, -f, self.container_name]]
    params:
      caller: [subprocess.run]
      shell: ["False", "False", "False"]

networks:
  devbisme.github.io:
    type: api
    actions: [GET]
    urls: [/skidl/]
    protocols: [https]
    ports: ["443"]
    params:
      caller: [parse_args]
      links: [default]
  github.com:
    type: api
    actions: [GET]
    urls: [/devbisme/skidl]
    protocols: [https]
    ports: ["443"]
    params:
      caller: [parse_args]
      links: [default]
